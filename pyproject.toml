[project]
name = "neutral-tts-workbench"
version = "0.1.0rc1"
description = "Local TTS desktop with guided setup, exact preview, and protected WAV storage"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
neutral-tts = "neutral_tts.cli:main"
neutral-tts-backup = "neutral_tts.backup_restore_cli:main"
neutral-tts-runtime-doctor = "neutral_tts.runtime_doctor:main"
neutral-tts-desktop = "neutral_tts.desktop:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
